<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="popup.css">
    <script type="module" src="popup.js"></script>
    <title>Flean</title>
</head>
<body>
    <div class="panel">
        <header class="panel-header">
            <div class="title">Flean</div>
            <div class="subtitle">Redirect Fandom wiki pages to Breezewiki mirrors</div>
        </header>

        <section class="row">
            <label for="mirror">Selected mirror</label>
            <select id="mirror"></select>
        </section>

        <section class="row small">
            <label for="askOnVisit">Ask every time</label>
            <input type="checkbox" id="askOnVisit" />
            <p class="muted">When enabled you'll be prompted on each redirect; when disabled hosts in the Redirect list will redirect automatically.</p>
        </section>

        <section class="row actions">
            <button id="save" class="btn primary">Save</button>
            <button id="reset" class="btn">Reset</button>
        </section>

        <section>
            <h3>Redirect list (hosts)</h3>
            <ul id="allowedList" class="allowed-list"></ul>
            <p class="muted">Add a fandom host (e.g. <code>deltarune.fandom.com</code>) to always redirect to the selected mirror.</p>
        </section>

    </div>
</body>
</html>
